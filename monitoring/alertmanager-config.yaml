alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "slack-notifications"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - match:
            severity: critical
          receiver: "slack-notifications"
          repeat_interval: 1h
    receivers:
      - name: "slack-notifications"
        slack_configs:
          - api_url: "<your-slack-webhook-url>"
            channel: "#taskly-alerts"
            send_resolved: true
            title: '{{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'